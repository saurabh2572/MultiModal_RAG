[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Layout-aware multimodal RAG for enterprise PDF documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.7",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.0.0",
    "langsmith>=0.9.0",
    "open-clip-torch>=3.2.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.26.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rapidocr>=3.0.0",
    "onnxruntime>=1.20.0",
    "sentence-transformers>=5.0.0",
    "streamlit>=1.59.0",
    "torchvision>=0.22.0",
]
